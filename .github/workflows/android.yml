name: Android Build

on:
  push:
    branches: [ main, master, SDL3 ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main, master, SDL3 ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# Permissions for the GITHUB_TOKEN
permissions:
  contents: write

env:
  SDL3_VERSION: "3.2.26"
  SDL3_IMAGE_VERSION: "3.2.4"

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components
      shell: pwsh
      run: |
        & "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat" --install "ndk;23.1.7779620"
        & "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat" --install "build-tools;34.0.0"
        & "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat" --install "platforms;android-34"
        & "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat" --install "cmake;3.22.1"
        
        # Set ANDROID_NDK_HOME environment variable for the rest of the workflow
        $ndkPath = Join-Path $env:ANDROID_SDK_ROOT "ndk\23.1.7779620"
        Add-Content $env:GITHUB_ENV "ANDROID_NDK_HOME=$ndkPath"
        Add-Content $env:GITHUB_ENV "ANDROID_HOME=$env:ANDROID_SDK_ROOT"

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Cache SDL3 native libraries
      uses: actions/cache@v4
      with:
        path: |
          android/app/src/main/cpp/SDL3
          android/app/src/main/cpp/SDL3_image
        key: ${{ runner.os }}-sdl3-v1-${{ env.SDL3_VERSION }}-${{ env.SDL3_IMAGE_VERSION }}

    - name: Download and Setup SDL3 for Android
      shell: pwsh
      run: |
        cd android
        
        # Run the setup script if it exists
        if (Test-Path "setup_sdl3_android.ps1") {
          Write-Host "Running setup_sdl3_android.ps1 to download and extract SDL3 AARs..."
          .\setup_sdl3_android.ps1
        } else {
          Write-Host "setup_sdl3_android.ps1 not found, SDL3 should already be configured"
        }

    - name: Generate asset manifest and copy assets into Android assets
      shell: pwsh
      run: |
        Write-Host "Preparing asset manifest and copying assets into android/app/src/main/assets/"
        $assetsDir = "android/app/src/main/assets"
        $manifest = "$assetsDir/asset_list.txt"
        New-Item -ItemType Directory -Path $assetsDir -Force | Out-Null

        if (Test-Path "scripts/generate_asset_manifest.py") {
          Write-Host "Found scripts/generate_asset_manifest.py, running it..."
          python scripts/generate_asset_manifest.py
        }

        if (-not (Test-Path $manifest) -or ((Get-Content $manifest -ErrorAction SilentlyContinue).Length -eq 0)) {
          Write-Host "Running inline manifest generator as fallback..."
          $files = @()
          foreach ($ext in @('png', 'jpg', 'bmp')) {
            $files += Get-ChildItem -Path sprites,assets -Filter "*.$ext" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName.Replace("$PWD\", "").Replace("\", "/") }
          }
          $files | Sort-Object -Unique | Set-Content $manifest
          
          foreach ($d in @('sprites', 'assets', 'maps')) {
            if (Test-Path $d) {
              $targetDir = "$assetsDir/$d"
              if (Test-Path $targetDir) { Remove-Item -Recurse -Force $targetDir }
              Copy-Item -Path $d -Destination $targetDir -Recurse -Force
            }
          }
          
          if (Test-Path $manifest) {
            $count = (Get-Content $manifest).Count
            Write-Host "Wrote manifest with $count entries to $manifest"
          }
        }

    - name: Build APK using build_with_jdk17.ps1
      shell: pwsh
      working-directory: android
      run: |
        Write-Host "Running build_with_jdk17.ps1..."
        .\build_with_jdk17.ps1

    - name: Sign APK (always - uses debug keystore if no secrets configured)
      shell: pwsh
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # Find the unsigned APK
        $unsignedApk = Get-ChildItem -Path android/app/build/outputs/apk/debug -Filter "*.apk" -Recurse | Select-Object -First 1 -ExpandProperty FullName
        $alignedApk = "android/app/build/outputs/apk/debug/app-debug-aligned.apk"
        $signedApk = "android/app/build/outputs/apk/debug/app-debug-signed.apk"
        
        if ($env:KEYSTORE_BASE64) {
          Write-Host "Using provided keystore from secrets"
          [Convert]::FromBase64String($env:KEYSTORE_BASE64) | Set-Content -Path keystore.jks -Encoding Byte
          $ksPass = $env:KEYSTORE_PASSWORD
          $ksAlias = $env:KEY_ALIAS
          $ksKeyPass = $env:KEY_PASSWORD
        } else {
          Write-Host "No keystore secret provided, generating debug keystore for signing"
          & keytool -genkey -v -keystore keystore.jks `
            -alias androiddebugkey `
            -keyalg RSA `
            -keysize 2048 `
            -validity 10000 `
            -storepass android `
            -keypass android `
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
          $ksPass = "android"
          $ksAlias = "androiddebugkey"
          $ksKeyPass = "android"
        }
        
        # Align APK
        & "$env:ANDROID_SDK_ROOT\build-tools\34.0.0\zipalign.exe" -v -p 4 "$unsignedApk" "$alignedApk"
        
        # Sign APK
        & "$env:ANDROID_SDK_ROOT\build-tools\34.0.0\apksigner.bat" sign `
          --ks keystore.jks `
          --ks-pass "pass:$ksPass" `
          --ks-key-alias "$ksAlias" `
          --key-pass "pass:$ksKeyPass" `
          --out "$signedApk" `
          "$alignedApk"
        
        # Verify the APK is signed
        & "$env:ANDROID_SDK_ROOT\build-tools\34.0.0\apksigner.bat" verify --verbose "$signedApk"
        
        # Clean up
        Remove-Item keystore.jks, $alignedApk -Force
        
        Write-Host "APK signed successfully!"

    - name: Copy signed APK to repository root
      shell: pwsh
      run: |
        # Copy the signed APK to root as Game.apk
        $signedApk = "android/app/build/outputs/apk/debug/app-debug-signed.apk"
        if (Test-Path $signedApk) {
          Copy-Item $signedApk Game.apk
          Write-Host "Copied signed APK to Game.apk"
        } else {
          Write-Host "ERROR: Signed APK not found!"
          exit 1
        }

    - name: Commit signed APK to repository
      if: github.event_name == 'push'
      shell: pwsh
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add Game.apk
        $hasChanges = git diff --staged --quiet; $LASTEXITCODE -ne 0
        if ($hasChanges) {
          git commit -m "Update Game.apk (signed build) [skip ci]"
          git push
        }

    - name: Upload signed APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-signed
        path: android/app/build/outputs/apk/debug/app-debug-signed.apk
        if-no-files-found: error

    - name: Create release artifacts zip
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path release-artifacts -Force | Out-Null
        Copy-Item android/app/build/outputs/apk/debug/*.apk release-artifacts/
        Compress-Archive -Path release-artifacts/* -DestinationPath sdl-game-android-debug.zip

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sdl-game-android-debug
        path: sdl-game-android-debug.zip
        if-no-files-found: warn
