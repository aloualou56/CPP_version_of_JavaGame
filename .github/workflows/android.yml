name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL3_VERSION: "3.2.26"
  SDL3_IMAGE_VERSION: "3.2.4"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components
      run: |
        sdkmanager --install "ndk;23.1.7779620"
        sdkmanager --install "build-tools;34.0.0"
        sdkmanager --install "platforms;android-34"
        sdkmanager --install "cmake;3.22.1"
        
        # Set environment variables
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.1.7779620" >> $GITHUB_ENV
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Cache SDL3 native libraries
      uses: actions/cache@v4
      with:
        path: |
          android/app/src/main/cpp/SDL3
          android/app/src/main/cpp/SDL3_image
        key: ${{ runner.os }}-sdl3-v1-${{ env.SDL3_VERSION }}-${{ env.SDL3_IMAGE_VERSION }}

    - name: Download and Setup SDL3 for Android
      run: |
        cd android/app/src/main/cpp
        
        # Extract SDL3 AAR if it exists
        if [ -f "SDL3/SDL3-${SDL3_VERSION}.aar" ]; then
          echo "Extracting SDL3 AAR..."
          rm -rf SDL3/aar_unpacked
          mkdir -p SDL3/aar_unpacked
          unzip -o "SDL3/SDL3-${SDL3_VERSION}.aar" -d SDL3/aar_unpacked
          
          # Copy SDL3 native libraries
          SDL3_LIBS_PATH="SDL3/aar_unpacked/prefab/modules/SDL3-shared/libs"
          if [ -d "$SDL3_LIBS_PATH" ]; then
            for ABI_DIR in "$SDL3_LIBS_PATH"/android.*; do
              ABI=$(basename "$ABI_DIR" | sed 's/^android\.//')
              mkdir -p "SDL3/lib/$ABI"
              if [ -f "$ABI_DIR/libSDL3.so" ]; then
                cp "$ABI_DIR/libSDL3.so" "SDL3/lib/$ABI/"
                echo "Copied libSDL3.so for $ABI"
              fi
            done
          fi
          
          # Copy SDL3 headers
          if [ -d "SDL3/aar_unpacked/prefab/modules/SDL3-Headers/include" ]; then
            mkdir -p SDL3/include
            cp -r SDL3/aar_unpacked/prefab/modules/SDL3-Headers/include/* SDL3/include/
            echo "Copied SDL3 headers"
          fi
        fi
        
        # Extract SDL3_image AAR if it exists
        if [ -f "SDL3_image/SDL3_image-${SDL3_IMAGE_VERSION}.aar" ]; then
          echo "Extracting SDL3_image AAR..."
          rm -rf SDL3_image/aar_unpacked
          mkdir -p SDL3_image/aar_unpacked
          unzip -o "SDL3_image/SDL3_image-${SDL3_IMAGE_VERSION}.aar" -d SDL3_image/aar_unpacked
          
          # Copy SDL3_image native libraries
          SDL3_IMAGE_LIBS_PATH="SDL3_image/aar_unpacked/prefab/modules/SDL3_image-shared/libs"
          if [ -d "$SDL3_IMAGE_LIBS_PATH" ]; then
            for ABI_DIR in "$SDL3_IMAGE_LIBS_PATH"/android.*; do
              ABI=$(basename "$ABI_DIR" | sed 's/^android\.//')
              mkdir -p "SDL3_image/lib/$ABI"
              if [ -f "$ABI_DIR/libSDL3_image.so" ]; then
                cp "$ABI_DIR/libSDL3_image.so" "SDL3_image/lib/$ABI/"
                echo "Copied libSDL3_image.so for $ABI"
              fi
            done
          fi
          
          # Copy SDL3_image headers
          if [ -d "SDL3_image/aar_unpacked/prefab/modules/SDL3_image-shared/include" ]; then
            mkdir -p SDL3_image/include
            cp -r SDL3_image/aar_unpacked/prefab/modules/SDL3_image-shared/include/* SDL3_image/include/
            echo "Copied SDL3_image headers"
          fi
        fi

    - name: Generate asset manifest and copy assets
      run: |
        echo "Preparing asset manifest and copying assets..."
        ASSETS_DIR="android/app/src/main/assets"
        mkdir -p "$ASSETS_DIR"
        
        # Copy asset directories
        for DIR in sprites assets maps; do
          if [ -d "$DIR" ]; then
            rm -rf "$ASSETS_DIR/$DIR"
            cp -r "$DIR" "$ASSETS_DIR/"
            echo "Copied $DIR to Android assets"
          fi
        done
        
        # Generate asset manifest
        MANIFEST="$ASSETS_DIR/asset_list.txt"
        > "$MANIFEST"
        for EXT in png jpg bmp; do
          find sprites assets -name "*.$EXT" 2>/dev/null | sort >> "$MANIFEST" || true
        done
        
        if [ -f "$MANIFEST" ]; then
          COUNT=$(wc -l < "$MANIFEST")
          echo "Generated manifest with $COUNT entries"
        fi

    - name: Build APK
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew clean assembleDebug

    - name: Sign APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # Find the debug APK
        UNSIGNED_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
        ALIGNED_APK="android/app/build/outputs/apk/debug/app-debug-aligned.apk"
        SIGNED_APK="android/app/build/outputs/apk/debug/app-debug-signed.apk"
        
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Using provided keystore from secrets"
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          KS_PASS="$KEYSTORE_PASSWORD"
          KS_ALIAS="$KEY_ALIAS"
          KS_KEY_PASS="$KEY_PASSWORD"
        else
          echo "No keystore secret provided, generating debug keystore"
          keytool -genkey -v -keystore keystore.jks \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
          KS_PASS="android"
          KS_ALIAS="androiddebugkey"
          KS_KEY_PASS="android"
        fi
        
        # Align APK
        "$ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
        
        # Sign APK
        "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" sign \
          --ks keystore.jks \
          --ks-pass "pass:$KS_PASS" \
          --ks-key-alias "$KS_ALIAS" \
          --key-pass "pass:$KS_KEY_PASS" \
          --out "$SIGNED_APK" \
          "$ALIGNED_APK"
        
        # Verify the APK
        "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose "$SIGNED_APK"
        
        # Clean up
        rm -f keystore.jks "$ALIGNED_APK"
        
        echo "APK signed successfully!"

    - name: Copy signed APK to repository root
      run: |
        SIGNED_APK="android/app/build/outputs/apk/debug/app-debug-signed.apk"
        if [ -f "$SIGNED_APK" ]; then
          cp "$SIGNED_APK" Game.apk
          echo "Copied signed APK to Game.apk"
        else
          echo "ERROR: Signed APK not found!"
          exit 1
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Game-APK
        path: Game.apk
        if-no-files-found: error
