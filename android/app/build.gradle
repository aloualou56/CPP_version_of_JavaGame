plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aloualou.cppgame'
    compileSdk 34

    defaultConfig {
        applicationId "com.aloualou.cppgame"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // Build for ARM ABIs
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    ndkVersion '23.1.7779620'

    sourceSets {
        main {
            // Include game assets from root
            assets.srcDirs = ['src/main/assets', '../../maps', '../../sprites']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation files('src/main/cpp/SDL3/SDL3-3.2.26.aar')
    implementation files('src/main/cpp/SDL3_image/SDL3_image-3.2.4.aar')
}
